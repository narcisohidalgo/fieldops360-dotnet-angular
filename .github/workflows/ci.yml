name: FieldOps 360 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore src/backend/FieldOps.slnx

      - name: Build .NET Release
        run: dotnet build src/backend/FieldOps.slnx --configuration Release --no-restore

      - name: Run .NET unit tests
        run: dotnet test src/backend/FieldOps.slnx --configuration Release --no-build --no-restore --verbosity minimal

  frontend:
    name: Frontend - Angular 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/frontend/fieldops-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/fieldops-web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Angular unit tests
        run: npm test -- --watch=false

      - name: Build Angular production
        run: npm run build
