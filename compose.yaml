name: fieldops360

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${FIELDOPS_SQL_SA_PASSWORD:?Configure FIELDOPS_SQL_SA_PASSWORD in .env}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - fieldops-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    profiles:
      - tools
    image: "${FIELDOPS_MIGRATIONS_IMAGE:-fieldops360-migrations:local}"
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__FieldOpsDb: "Server=sqlserver,1433;Database=FieldOpsDockerDb;User ID=sa;Password=${FIELDOPS_SQL_SA_PASSWORD:?Configure FIELDOPS_SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30;"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fieldops-network
    restart: "no"

  api:
    image: "${FIELDOPS_API_IMAGE:-fieldops360-api:local}"
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ReverseProxy__KnownProxy: "172.30.240.10"
      ConnectionStrings__FieldOpsDb: "Server=sqlserver,1433;Database=FieldOpsDockerDb;User ID=fieldops_app;Password=${FIELDOPS_SQL_APP_PASSWORD:?Run the database runtime provisioning script};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30;"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      fieldops-network:
      proxy-network:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    image: "${FIELDOPS_WEB_IMAGE:-fieldops360-web:local}"
    build:
      context: ./src/frontend/fieldops-web
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - tls-material:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_started
    networks:
      proxy-network:
        ipv4_address: 172.30.240.10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  tls-material:
  data-protection-keys:
  sqlserver-data:

networks:
  fieldops-network:
    driver: bridge
  proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.240.0/28
          ip_range: 172.30.240.0/29
          gateway: 172.30.240.1
